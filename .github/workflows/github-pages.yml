name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble site (web assets only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets Audios Videos _site/
          if [ -f imsmanifest.xml ]; then cp imsmanifest.xml _site/; fi

      - name: Configure Pages
        # Do not set enablement: true — GITHUB_TOKEN cannot create a Pages site.
        # One-time setup: Settings → Pages → Source → GitHub Actions
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
